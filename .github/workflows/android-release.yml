name: android-release

# On any tag push (e.g. 1.0.0): build the debug APK and publish a
# GitHub Release named CalcPro-<tag> with the APK attached.
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          set -eo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          [ -n "$SDKMGR" ] || { echo "sdkmanager not found in $ANDROID_HOME" >&2; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37" "build-tools;37.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Build debug APK
        run: |
          set -eo pipefail
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-37/android.jar"
          export ANDROID_KS="$RUNNER_TEMP/debug.keystore"
          ./android/build.sh

      - name: Verify APK
        run: |
          set -eo pipefail
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs android/QuadrantCalcPro-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuadrantCalcPro-${{ github.ref_name }}-debug
          path: android/QuadrantCalcPro-debug.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CalcPro-${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: android/QuadrantCalcPro-debug.apk
