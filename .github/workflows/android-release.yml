name: android-release

# On any tag push (e.g. 1.0.0):
#   verify the pre-signed release APK committed at releases/ (signed locally
#   with the long-lived release keystore), check the source build still
#   reproduces it, and publish a GitHub release "CalcPro-<tag>" with the APK.
#
# The APK is pre-signed locally because this environment does not deliver
# repository secrets (keystore) to runners. The private key never lives in
# the repo — only the public, signed artifact does.
#
# F-Droid main (f-droid/fdroiddata) hosts this exact APK via its Binaries:
# URL, so installs/updates stay conflict-free across both channels.
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          set -eo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          [ -n "$SDKMGR" ] || { echo "sdkmanager not found in $ANDROID_HOME" >&2; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37.0" "build-tools;37.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Verify pre-signed release APK
        run: |
          set -eo pipefail
          APK="releases/QuadrantCalcPro-release.apk"
          [ -f "$APK" ] || { echo "::error::committed release APK missing at $APK" >&2; exit 1; }
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify -v --print-certs "$APK" | tee verify.txt
          grep -q "CN=Quadrant Calc Pro" verify.txt \
            || { echo "::error::release APK is not signed with the Quadrant Calc Pro release key" >&2; exit 1; }
          echo "Release APK signature OK."

      - name: Reproducibility check (source build matches release APK)
        run: |
          set -eo pipefail
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-37.0/android.jar"
          export ANDROID_KS=""            # unsigned build; F-Droid-style
          export ANDROID_OUT="$RUNNER_WORKSPACE/unsigned.apk"
          ./android/build.sh
          python3 - "$RUNNER_WORKSPACE/unsigned.apk" "releases/QuadrantCalcPro-release.apk" <<'PY'
import hashlib, sys, zipfile

def entries(path):
    out = {}
    with zipfile.ZipFile(path) as z:
        for n in z.namelist():
            out[n] = hashlib.sha256(z.read(n)).hexdigest()
    return out

a, b = entries(sys.argv[1]), entries(sys.argv[2])
if a != b:
    only_a, only_b, diff = set(a) - set(b), set(b) - set(a), [k for k in a if a[k] != b.get(k)]
    print(f"MISMATCH: only-source={sorted(only_a)} only-release={sorted(only_b)} differing={diff}")
    sys.exit(1)
print(f"Source build reproduces the release APK ({len(a)} entries identical, signature block aside).")
PY

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: releases/QuadrantCalcPro-release.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CalcPro-${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: dist/QuadrantCalcPro-release.apk
