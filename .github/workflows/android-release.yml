name: android-release

# On any tag push (e.g. 1.0.0):
#   build the APK signed with the long-lived RELEASE keystore (repo secrets)
#   and publish a GitHub release "CalcPro-<tag>" with the APK attached.
#
# F-Droid main (f-droid/fdroiddata) hosts this exact release-signed APK via
# its Binaries: URL, so installs/updates stay conflict-free across both
# channels (same file, same signing key).
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          set -eo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          [ -n "$SDKMGR" ] || { echo "sdkmanager not found in $ANDROID_HOME" >&2; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37.0" "build-tools;37.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Restore release keystore from secrets
        run: |
          set -eo pipefail
          echo "diag: B64 len=${#RELEASE_KEYSTORE_B64} PASS len=${#RELEASE_KEYSTORE_PASS}"
          if [ -z "${RELEASE_KEYSTORE_B64:-}" ] || [ -z "${RELEASE_KEYSTORE_PASS:-}" ]; then
            echo "::error::GitHub secrets RELEASE_KEYSTORE_B64 / RELEASE_KEYSTORE_PASS are missing — refusing to publish."
            exit 1
          fi
          base64 -d <<<"$RELEASE_KEYSTORE_B64" > "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$RELEASE_KEYSTORE_PASS" | head -5

      - name: Build release-signed APK
        run: |
          set -eo pipefail
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-37.0/android.jar"
          export ANDROID_KS="$RUNNER_TEMP/release.keystore"
          export ANDROID_KS_ALIAS="quadrantcalc"
          export ANDROID_KS_PASS="$RELEASE_KEYSTORE_PASS"
          export ANDROID_OUT="$GITHUB_WORKSPACE/android/QuadrantCalcPro-release.apk"
          ./android/build.sh

      - name: Verify APK signature
        run: |
          set -eo pipefail
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify -v --print-certs android/QuadrantCalcPro-release.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: android/QuadrantCalcPro-release.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CalcPro-${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: dist/QuadrantCalcPro-release.apk
