name: secret-probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe secret presence
        run: |
          echo "new B64 len=${#RELEASE_KEYSTORE_B64} new PASS len=${#RELEASE_KEYSTORE_PASS}"
          echo "old B64 len=${#KEYSTORE_BASE64} old PASS len=${#KEYSTORE_PASSWORD} old ALIAS len=${#KEY_ALIAS} old KPASS len=${#KEY_PASSWORD}"
