name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify committed web assets are up to date
        run: |
          if ! git diff --quiet -- android/app/src/main/assets/public; then
            echo "::error::android/app/src/main/assets/public is out of date."
            echo "Run 'npm run build:android && npx cap sync android' and commit the result."
            git diff --stat -- android/app/src/main/assets/public
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          echo "Keystore decoded"

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$APK" | head -3

      - name: Check that the version matches the tag
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          VERSION=$($ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          TAG=${{ github.event.inputs.tag || github.ref_name }}
          TAG_VERSION=${TAG#v}
          echo "APK version: $VERSION / tag: $TAG"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::The APK version ($VERSION) does not match the tag ($TAG). Update versionName in android/app/build.gradle."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculatorpro-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: CalculatorPro ${{ github.event.inputs.tag || github.ref_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          body: |
            Download the APK below and install it on your device (Android 7.0 / API 24 and newer).

            The app is also available on [F-Droid](https://f-droid.org/packages/com.stormfiber.calculator/).
