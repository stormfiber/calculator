    <rect x="300" y="262" width="424" height="100" rx="18" ry="18"/>
    <rect x="300" y="420" width="96" height="96" rx="24" ry="24"/>
    <rect x="464" y="420" width="96" height="96" rx="24" ry="24"/>
    <rect x="628" y="420" width="96" height="96" rx="24" ry="24"/>
    <rect x="300" y="546" width="96" height="96" rx="24" ry="24"/>
    <rect x="464" y="546" width="96" height="96" rx="24" ry="24"/>
    <rect x="628" y="546" width="96" height="96" rx="24" ry="24"/>
    <rect x="300" y="672" width="96" height="96" rx="24" ry="24"/>
    <rect x="464" y="672" width="96" height="96" rx="24" ry="24"/>
    <rect x="628" y="672" width="96" height="96" rx="24" ry="24"/>
