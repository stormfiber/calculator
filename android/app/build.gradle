apply plugin: 'com.android.application'

// Release signing is opt-in. When no keystore is provided the release build stays
// unsigned, which is exactly what F-Droid expects (F-Droid signs the APK itself).
// CI provides a keystore through the KEYSTORE_FILE / KEYSTORE_PASSWORD /
// KEY_ALIAS / KEY_PASSWORD environment variables.
def keystoreFilePath = project.findProperty('keystoreFile') ?: System.getenv('KEYSTORE_FILE')
def keystoreStorePassword = System.getenv('KEYSTORE_PASSWORD')
def keystoreKeyAlias = System.getenv('KEY_ALIAS')
def keystoreKeyPassword = System.getenv('KEY_PASSWORD')

android {
    namespace = "com.stormfiber.calculator"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.stormfiber.calculator"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode project.hasProperty('appVersionCode') ? project.appVersionCode.toInteger() : 1
        versionName project.hasProperty('appVersionName') ? project.appVersionName : "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (keystoreFilePath) {
                storeFile rootProject.file(keystoreFilePath)
                storePassword keystoreStorePassword
                keyAlias keystoreKeyAlias
                keyPassword keystoreKeyPassword
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreFilePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        // The Gradle version is pinned on purpose: F-Droid only accepts the
        // wrapper versions from its own checksum list, and 8.14.3 is the
        // highest one that is allowed there.
        disable 'AndroidGradlePluginVersion'
        abortOnError = true
        warningsAsErrors = true
        lintConfig = file('lint.xml')
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.capacitorjs:core:$capacitorVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
