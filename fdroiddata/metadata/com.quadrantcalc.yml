AutoName: Quadrant Calc Pro
Description: |-
  A four-mode Material 3 calculator (Basic, Standard, Professional,
  Scientific) with paper-tape history, professional tools and a scientific
  self-test suite. A static web app in a WebView shell; no network access
  and no tracking.

