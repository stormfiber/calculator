AutoName: Quadrant Calc Pro
Description: |-
  A four-mode Material 3 calculator (Basic, Standard, Professional,
  Scientific) with paper-tape history, professional tools and a scientific
  self-test suite. A static web app in a WebView shell; no network access
  and no tracking.

RepoType: git
Repo: https://github.com/stormfiber/calculator.git
Binaries: 
  https://github.com/stormfiber/calculator/releases/download/%v/QuadrantCalcPro-release.apk

Builds:
  - versionName: 1.0.0
    versionCode: 10000
    commit: 1.0.0
    output: out/QuadrantCalcPro-release.apk
    build:
      - rm -rf out && mkdir -p out
      - SM=$(for c in /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager /opt/android-sdk/cmdline-tools/bin/sdkmanager $(command -v sdkmanager 2>/dev/null); do [ -x "$c" ] && echo "$c" && break; done || true); echo "sdkmanager=$SM"; ls /opt/android-sdk; if [ -n "$SM" ]; then yes | $SM "platforms;android-31" || true; fi; ls /opt/android-sdk/platforms 2>/dev/null || true
      - ANDROID_KS= ANDROID_OUT="$(pwd)/out/QuadrantCalcPro-release.apk" ./android/build.sh

AllowedAPKSigningKeys: 9320b2f4f465d195b48a2770d7156509b9f79f5abf40397dd44f72e357de2275

MaintainerNotes: |-
  Custom aapt2/javac/d8 pipeline (android/build.sh), no Gradle. The
  assembly is byte-reproducible (deterministic zip dates/ordering); the
  source build runs unsigned (ANDROID_KS empty) and F-Droid signs it.
  Binaries: points at the release-key-signed APK from our GitHub releases
  (tag == versionName), which F-Droid hosts as-is; AllowedAPKSigningKeys
  pins that release certificate.

