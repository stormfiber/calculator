AllowedAPKSigningKeys: 9320b2f4f465d195b48a2770d7156509b9f79f5abf40397dd44f72e357de2275

MaintainerNotes: |-
  Custom aapt2/javac/d8 pipeline (android/build.sh), no Gradle. The pipeline
  is byte-reproducible (deterministic assembly; two clean builds produce
  identical unsigned APKs, differing only in the signature block). Binaries:
  points at the release-key-signed APK from our GitHub releases (tag ==
  versionName), which F-Droid hosts as-is; AllowedAPKSigningKeys pins that
  release certificate. The source build is used for verification only.

